version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dairy_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dairy_hub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dairy_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dairy_hub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dairy_hub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"    

volumes:
  dairy_hub_pgdata: